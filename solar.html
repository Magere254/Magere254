<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mini Solar System</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
    /* A text box floating on top of the 3D scene */
    #hud {
      position: absolute; top: 12px; left: 12px; color: #fff;
      background: rgba(0, 0, 0, 0.55); padding: 10px 14px;
      border-radius: 8px; font-size: 14px; line-height: 1.5; pointer-events: none;
    }
    #hud b { color: #ffd966; }
  </style>
</head>
<body>

  <div id="hud">
    <b>Mini Solar System</b><br>
    Drag: rotate &nbsp;|&nbsp; Scroll: zoom<br>
    Click a planet: select it<br>
    Space: pause &nbsp;|&nbsp; Up/Down arrows: speed<br>
    <br>
    Selected: <b id="selected">none</b><br>
    Speed: <b id="speed">1.0x</b>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // ---------------------------------------------------------------
    // 1. BASIC SETUP: scene, camera, renderer
    // ---------------------------------------------------------------
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(
      60, window.innerWidth / window.innerHeight, 0.1, 500
    );
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // ---------------------------------------------------------------
    // 2. LIGHTS: the sun is a point light that shines in all directions
    // ---------------------------------------------------------------
    scene.add(new THREE.AmbientLight(0xffffff, 0.15));     // faint light so the dark sides aren't pure black
    scene.add(new THREE.PointLight(0xffffff, 1.6, 0));     // placed at (0,0,0), inside the sun

    // ---------------------------------------------------------------
    // 3. THE SUN: MeshBasicMaterial ignores lighting, so it always glows
    // ---------------------------------------------------------------
    const sun = new THREE.Mesh(
      new THREE.SphereGeometry(2, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0xffcc33 })
    );
    scene.add(sun);

    // ---------------------------------------------------------------
    // 4. THE PLANETS
    // Each planet is described by a simple object (data), then we loop
    // over the list to build them. This avoids repeating code.
    // ---------------------------------------------------------------
    const planetData = [
      { name: "Ember",  size: 0.5, distance: 5,  speed: 1.6, color: 0xcc6633 },
      { name: "Aqua",   size: 0.8, distance: 8,  speed: 1.0, color: 0x3399ff, hasMoon: true },
      { name: "Jade",   size: 0.7, distance: 11, speed: 0.7, color: 0x44cc77 },
      { name: "Titan",  size: 1.3, distance: 15, speed: 0.4, color: 0xddaa66 },
    ];

    const planets = [];  // we keep the planet meshes here so we can click them later

    planetData.forEach((data) => {
      // A "pivot" is an invisible group at the center. Spinning the pivot
      // makes everything attached to it travel in a circle (an orbit).
      const pivot = new THREE.Group();
      scene.add(pivot);

      const planet = new THREE.Mesh(
        new THREE.SphereGeometry(data.size, 32, 32),
        new THREE.MeshStandardMaterial({ color: data.color })
      );
      planet.position.x = data.distance;   // push the planet out from the center
      planet.userData = data;              // store its info on the mesh for later
      pivot.add(planet);

      // A thin ring on the floor to show the orbit path
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(data.distance - 0.03, data.distance + 0.03, 128),
        new THREE.MeshBasicMaterial({
          color: 0x888888, side: THREE.DoubleSide, transparent: true, opacity: 0.35
        })
      );
      ring.rotation.x = -Math.PI / 2;      // lay the ring flat
      scene.add(ring);

      // Optional moon: a second pivot attached to the planet itself
      if (data.hasMoon) {
        const moonPivot = new THREE.Group();
        planet.add(moonPivot);
        const moon = new THREE.Mesh(
          new THREE.SphereGeometry(0.22, 16, 16),
          new THREE.MeshStandardMaterial({ color: 0xcccccc })
        );
        moon.position.x = 1.5;
        moonPivot.add(moon);
        data.moonPivot = moonPivot;
      }

      data.pivot = pivot;
      data.angle = Math.random() * Math.PI * 2;  // random starting spot
      planets.push(planet);
    });

    // ---------------------------------------------------------------
    // 5. STARFIELD: lots of tiny points scattered far away
    // ---------------------------------------------------------------
    const starPositions = [];
    for (let i = 0; i < 1500; i++) {
      // pick a random direction, then push it far from the center
      const dir = new THREE.Vector3(
        Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5
      ).normalize();
      dir.multiplyScalar(100 + Math.random() * 100);
      starPositions.push(dir.x, dir.y, dir.z);
    }
    const starGeometry = new THREE.BufferGeometry();
    starGeometry.setAttribute(
      "position", new THREE.Float32BufferAttribute(starPositions, 3)
    );
    scene.add(new THREE.Points(
      starGeometry, new THREE.PointsMaterial({ color: 0xffffff, size: 0.6 })
    ));

    // ---------------------------------------------------------------
    // 6. CAMERA CONTROLS (written by hand, no extra libraries)
    // We place the camera on an invisible sphere around the center.
    // theta = left/right angle, phi = up/down angle, radius = distance.
    // ---------------------------------------------------------------
    let theta = 0.6, phi = 1.1, radius = 28;

    function updateCamera() {
      camera.position.set(
        radius * Math.sin(phi) * Math.sin(theta),
        radius * Math.cos(phi),
        radius * Math.sin(phi) * Math.cos(theta)
      );
      camera.lookAt(0, 0, 0);
    }
    updateCamera();

    let dragging = false, dragDistance = 0, lastX = 0, lastY = 0;

    renderer.domElement.addEventListener("pointerdown", (e) => {
      dragging = true; dragDistance = 0; lastX = e.clientX; lastY = e.clientY;
    });

    window.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const dx = e.clientX - lastX, dy = e.clientY - lastY;
      dragDistance += Math.abs(dx) + Math.abs(dy);
      theta -= dx * 0.005;
      phi -= dy * 0.005;
      phi = Math.max(0.15, Math.min(Math.PI - 0.15, phi));  // don't flip upside down
      lastX = e.clientX; lastY = e.clientY;
      updateCamera();
    });

    window.addEventListener("pointerup", (e) => {
      dragging = false;
      if (dragDistance < 5) handleClick(e);  // barely moved = it was a click, not a drag
    });

    renderer.domElement.addEventListener("wheel", (e) => {
      radius += e.deltaY * 0.02;
      radius = Math.max(8, Math.min(50, radius));  // keep zoom within limits
      updateCamera();
    });

    // ---------------------------------------------------------------
    // 7. CLICKING ON PLANETS using a Raycaster
    // A raycaster shoots an invisible line from the camera through the
    // mouse position and tells us which objects it hits.
    // ---------------------------------------------------------------
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const selectedLabel = document.getElementById("selected");

    function handleClick(e) {
      // convert pixel position to the -1..+1 range three.js expects
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      // un-highlight every planet first
      planets.forEach((p) => p.material.emissive.setHex(0x000000));
      selectedLabel.textContent = "none";

      const hits = raycaster.intersectObjects(planets);
      if (hits.length > 0) {
        const planet = hits[0].object;
        planet.material.emissive.setHex(0x333333);  // make it glow a little
        selectedLabel.textContent = planet.userData.name;
      }
    }

    // ---------------------------------------------------------------
    // 8. KEYBOARD: pause and speed
    // ---------------------------------------------------------------
    let paused = false, speed = 1;
    const speedLabel = document.getElementById("speed");

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") { paused = !paused; e.preventDefault(); }
      if (e.code === "ArrowUp")   speed = Math.min(5, speed + 0.5);
      if (e.code === "ArrowDown") speed = Math.max(0.5, speed - 0.5);
      speedLabel.textContent = speed.toFixed(1) + "x" + (paused ? " (paused)" : "");
    });

    // ---------------------------------------------------------------
    // 9. ANIMATION LOOP
    // The clock gives the time since the last frame, so movement is the
    // same speed on slow and fast computers.
    // ---------------------------------------------------------------
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (!paused) {
        sun.rotation.y += delta * 0.2;

        planetData.forEach((data, i) => {
          data.angle += delta * data.speed * speed * 0.5;
          data.pivot.rotation.y = data.angle;         // orbit around the sun
          planets[i].rotation.y += delta * 1.5 * speed;  // spin on its own axis
          if (data.moonPivot) {
            data.moonPivot.rotation.y += delta * 3 * speed;  // moon orbits the planet
          }
        });
      }

      renderer.render(scene, camera);
    }
    animate();

    // Resize handling
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>

</body>
</html>
